[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "geoscene-engine"
version = "0.1.0"
description = "Bounded COG tile and statistics API with durable jobs and measurable cache behavior"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "rasterio>=1.4,<2", "numpy>=2,<3", "requests>=2.32,<3", "pillow>=11,<14"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
[tool.setuptools.packages.find]
include = ["geoscene_engine*"]
[tool.setuptools.package-data]
geoscene_engine = ["assets/*.json", "assets/web/*.html"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
